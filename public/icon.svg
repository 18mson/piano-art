<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#131b2e" />
    </linearGradient>
    <linearGradient id="keyHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="blackKeyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.3" />

  <!-- Stars -->
  <circle cx="120" cy="110" r="3" fill="#bae6fd" opacity="0.9" />
  <circle cx="380" cy="95" r="4" fill="#38bdf8" opacity="0.8" />
  <circle cx="250" cy="70" r="2.5" fill="#f8fafc" opacity="0.7" />
  <circle cx="430" cy="180" r="3" fill="#a855f7" opacity="0.9" />
  <circle cx="80" cy="200" r="3.5" fill="#bae6fd" opacity="0.8" />

  <!-- Velvet Felt & Gold Trim -->
  <rect x="56" y="210" width="400" height="12" fill="#881337" rx="2" />
  <rect x="56" y="210" width="400" height="2.5" fill="#d97706" />

  <!-- White Keys (7 keys) -->
  <!-- 400 / 7 = 57.14 width -->
  <g id="white-keys">
    <rect x="56" y="222" width="56" height="210" rx="3" fill="url(#keyHighlight)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="113" y="222" width="56" height="210" rx="3" fill="url(#keyHighlight)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="170" y="222" width="56" height="210" rx="3" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="227" y="222" width="56" height="210" rx="3" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="284" y="222" width="56" height="210" rx="3" fill="url(#keyHighlight)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="341" y="222" width="56" height="210" rx="3" fill="url(#keyHighlight)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="398" y="222" width="58" height="210" rx="3" fill="url(#keyHighlight)" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Key Bottom 3D shadow lips -->
  <rect x="56" y="424" width="56" height="8" rx="2" fill="#94a3b8" />
  <rect x="113" y="424" width="56" height="8" rx="2" fill="#94a3b8" />
  <rect x="170" y="424" width="56" height="8" rx="2" fill="#0284c7" />
  <rect x="227" y="424" width="56" height="8" rx="2" fill="#0284c7" />
  <rect x="284" y="424" width="56" height="8" rx="2" fill="#94a3b8" />
  <rect x="341" y="424" width="56" height="8" rx="2" fill="#94a3b8" />
  <rect x="398" y="424" width="58" height="8" rx="2" fill="#94a3b8" />

  <!-- Black Keys -->
  <g id="black-keys">
    <rect x="95" y="222" width="34" height="126" rx="3" fill="url(#blackKeyGrad)" stroke="#0f172a" stroke-width="2" />
    <rect x="152" y="222" width="34" height="126" rx="3" fill="url(#blackKeyGrad)" stroke="#0f172a" stroke-width="2" />
    <rect x="266" y="222" width="34" height="126" rx="3" fill="url(#blackKeyGrad)" stroke="#0f172a" stroke-width="2" />
    <rect x="323" y="222" width="34" height="126" rx="3" fill="url(#blackKeyGrad)" stroke="#0f172a" stroke-width="2" />
    <rect x="380" y="222" width="34" height="126" rx="3" fill="url(#blackKeyGrad)" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- Cyan Sparkle on Middle Keys -->
  <circle cx="200" cy="380" r="4" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="255" cy="370" r="3" fill="#a855f7" filter="url(#glow)" />
</svg>
